    <style>
      .checkbox-group.disabled .checkbox-item:not(.any-checkbox) {
        opacity: 0.5;
        pointer-events: none;
      }
      .any-checkbox {
        pointer-events: auto !important;
        opacity: 1 !important;
      }
      #listingForm .listing-choice-title {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 10px;
      }
      #listingForm .listing-choice-cards {
        display: flex;
        gap: 12px;
      }
      #listingForm .listing-choice-card {
        flex: 1;
        min-width: 0;
        margin: 0;
        padding: 16px;
        text-align: left;
        color: #000;
        background: #fff;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        box-shadow: none;
      }
      #listingForm .listing-choice-card:hover {
        border-color: #1a73e8;
        background: #f7faff;
        box-shadow: none;
      }
      #listingForm .listing-choice-card[aria-pressed="true"] {
        border-color: #1a73e8;
        background: #edf4ff;
      }
      #listingForm .listing-choice-card:focus-visible {
        outline: 3px solid #1a73e8;
        outline-offset: 2px;
      }
      #listingForm .listing-choice-name,
      #listingForm .listing-choice-description {
        display: block;
      }
      #listingForm .listing-choice-name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      #listingForm .listing-choice-description,
      #listingForm .price-help {
        font-size: 14px;
        line-height: 1.4;
        color: #555;
      }
      #listingForm .price-help {
        margin: 8px 0 0;
      }
      #post-listing-submit {
        min-width: 230px;
        max-width: none;
      }
      #post-listing-submit:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
      @media (max-width: 600px) {
        #listingForm .listing-choice-cards {
          flex-direction: column;
        }
        #post-listing-submit {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
    <script>
    ;(function(){
      const saved = [];
      const orig = document.addEventListener;
      // override addEventListener
      document.addEventListener = function(type, fn, opts) {
        if (type === 'DOMContentLoaded') {
          saved.push(fn);
        } else {
          orig.call(this, type, fn, opts);
        }
      };
      // install one real listener
      orig.call(document, 'DOMContentLoaded', () => {
        saved.forEach(fn => {
          try { fn() } catch(e) { console.error(e) }
        });
      });
    })();
    </script>

  <body>
    <main>
      <p id="output"></p>
      <div class="top">
        <div class="top-left">
          <div id="current-time"></div>
          <a href="/">&lt; Swipe Market</a>
        </div>
        <div class="top-right">
          <a href="https://forms.gle/7M3JpiJ9RoapZmxF6" target="blank" class="feedback">
            Feedback
          </a>
          <div class="signin-container">
            <div id="g_id_signin" class="g_id_signin" data-type="standard"></div>
          </div>
          <div id="profile-menu" class="profile-menu">
            <img id="profile-icon" src="" alt="Profile" />
            <div id="profile-dropdown" class="profile-dropdown">
              <a href="/profile"><button>Profile</button></a>
              <button onclick="handleSignOut()">Sign Out</button>
            </div>
          </div>
        </div>
      </div>
      <header class="header" id="index-header">
        <a href="/post_listings">Post Listing</a> 
      </header>
      <div class="subheading">Enter details for a swipe you want to buy or sell. You must be signed in to submit.</div>
      <section style="max-width: 1000px; margin: 20px auto; padding: 20px;">
        <div class="seller-form">
          <form id="listingForm" action="/submit_listing" method="POST" onsubmit="return requireSignIn(event)">
            <div class="form-group" role="group" aria-labelledby="listing-choice-title">
              <div class="listing-choice-title" id="listing-choice-title">What would you like to do?</div>
              <div class="listing-choice-cards">
                <button type="button" class="listing-choice-card" data-listing-type="seller" aria-pressed="false">
                  <span class="listing-choice-name">Sell a Swipe</span>
                  <span class="listing-choice-description">I have a meal plan and can swipe someone in.</span>
                </button>
                <button type="button" class="listing-choice-card" data-listing-type="buyer" aria-pressed="false">
                  <span class="listing-choice-name">Buy a Swipe</span>
                  <span class="listing-choice-description">I need someone with a meal plan to swipe me in.</span>
                </button>
              </div>
            </div>
            <div class="form-group">
              <label>Dining hall:</label>
              <div class="checkbox-group two-columns" id="dining-hall-group">
                <div class="checkbox-item">
                  <input type="checkbox" id="john_jay" name="dining_hall[]" value="John Jay">
                  <label for="john_jay">John Jay</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="jjs" name="dining_hall[]" value="JJ's">
                  <label for="jjs">JJ's</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="ferris" name="dining_hall[]" value="Ferris">
                  <label for="ferris">Ferris</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="faculty_house" name="dining_hall[]" value="Faculty House">
                  <label for="faculty_house">Faculty House</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="chef_mikes" name="dining_hall[]" value="Chef Mike's">
                  <label for="chef_mikes">Chef Mike's</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="chef_dons" name="dining_hall[]" value="Chef Don's">
                  <label for="chef_dons">Chef Don's</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="grace_dodge" name="dining_hall[]" value="Grace Dodge">
                  <label for="grace_dodge">Grace Dodge</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="fac_shack" name="dining_hall[]" value="Fac Shack">
                  <label for="fac_shack">Fac Shack</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="johnnys" name="dining_hall[]" value="Johnny's">
                  <label for="johnnys">Johnny's</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="hewitt" name="dining_hall[]" value="Hewitt">
                  <label for="hewitt">Hewitt</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="diana" name="dining_hall[]" value="Diana">
                  <label for="diana">Diana</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="dining_any" name="dining_hall[]" value="Any">
                  <label for="dining_any">Any</label>
                </div>
              </div>
            </div>
            
            <div class="form-group">
              <label for="date">Date:</label>
              <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group time-group">
              <div class="time-input">
                <label for="start_time">Start:</label>
                <input type="time" id="start_time" name="start_time" required>
              </div>
              <div class="time-input">
                <label for="end_time">End:</label>
                <input type="time" id="end_time" name="end_time" required>
              </div>
            </div>
            
            <div class="form-group">
              <label for="price" id="price-label">Price ($0 to donate)</label>
              <div class="price-input-wrapper">
                <span class="dollar-sign">$</span>
                <input type="number" id="price" name="price" min="0" step="0.01" placeholder="Enter price" required>
              </div>
              <p class="price-help" id="price-help" hidden></p>
            </div>
            
            <div class="form-group">
              <label>Payment Methods:</label>
              <div class="checkbox-group two-columns" id="payment-method-group">
                <div class="checkbox-item">
                  <input type="checkbox" id="venmo" name="payment_methods[]" value="Venmo">
                  <label for="venmo">Venmo</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="paypal" name="payment_methods[]" value="PayPal">
                  <label for="paypal">PayPal</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="cashapp" name="payment_methods[]" value="Cash App">
                  <label for="cashapp">Cash App</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="zelle" name="payment_methods[]" value="Zelle">
                  <label for="zelle">Zelle</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="cash" name="payment_methods[]" value="Cash">
                  <label for="cash">Cash</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="payment_any" name="payment_methods[]" value="Any">
                  <label for="payment_any">Any</label>
                </div>
                <div class="checkbox-item">
                  <input type="checkbox" id="other" name="payment_methods[]" value="Other">
                  <label for="other">Other</label>
                </div>
              </div>
            </div>
            
            <input type="hidden" name="poster_name" id="poster_name" value="">
            <input type="hidden" name="poster_email" id="poster_email" value="">
            <input type="hidden" name="listing_type" id="listing_type" value="">
            
            <div class="form-group button-group">
              <button type="submit" class="offer-button" id="post-listing-submit" disabled>Select Buy or Sell to Continue</button>
            </div>
          </form>
        </div>
      </section>
      <div class="footer"><p></p></div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const listingForm = document.getElementById('listingForm');
        const listingTypeInput = document.getElementById('listing_type');
        const listingChoices = listingForm.querySelectorAll('.listing-choice-card');
        const priceLabel = document.getElementById('price-label');
        const priceHelp = document.getElementById('price-help');
        const submitButton = document.getElementById('post-listing-submit');
        const copy = {
          seller: {
            price: "Price you'll receive ($)",
            help: 'Amount you want to charge for a swipe.',
            submit: 'Post Selling Offer'
          },
          buyer: {
            price: "Price you're willing to pay ($)",
            help: "Amount you're offering someone to swipe you in.",
            submit: 'Post Buying Request'
          }
        };

        listingChoices.forEach(choice => {
          choice.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
              event.preventDefault();
              this.click();
            }
          });
          choice.addEventListener('click', function() {
            const type = this.dataset.listingType;
            setListingType(type);
            listingChoices.forEach(card => {
              card.setAttribute('aria-pressed', String(card === this));
            });
            priceLabel.textContent = copy[type].price;
            priceHelp.textContent = copy[type].help;
            priceHelp.hidden = false;
            submitButton.textContent = copy[type].submit;
            submitButton.disabled = false;
          });
        });

        listingForm.addEventListener('submit', function(event) {
          if (!listingTypeInput.value) event.preventDefault();
        });

        // Handle dining hall checkboxes
        const diningHallGroup = document.getElementById('dining-hall-group');
        const anyDiningHall = document.getElementById('dining_any');
        anyDiningHall.closest('.checkbox-item').classList.add('any-checkbox');
        
        anyDiningHall.addEventListener('change', function() {
          if (this.checked) {
            diningHallGroup.classList.add('disabled');
            // Uncheck all other checkboxes
            diningHallGroup.querySelectorAll('input[type="checkbox"]:not(#dining_any)').forEach(checkbox => {
              checkbox.checked = false;
            });
          } else {
            diningHallGroup.classList.remove('disabled');
          }
        });

        // Handle payment method checkboxes
        const paymentGroup = document.getElementById('payment-method-group');
        const anyPayment = document.getElementById('payment_any');
        anyPayment.closest('.checkbox-item').classList.add('any-checkbox');
        
        anyPayment.addEventListener('change', function() {
          if (this.checked) {
            paymentGroup.classList.add('disabled');
            // Uncheck all other checkboxes
            paymentGroup.querySelectorAll('input[type="checkbox"]:not(#payment_any)').forEach(checkbox => {
              checkbox.checked = false;
            });
          } else {
            paymentGroup.classList.remove('disabled');
          }
        });
      });
    </script>
  </body>
